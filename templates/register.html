{% extends "base.html" %}

{% block content %}
<div class="card login-card">
    <h2>用户注册</h2>

    <form method="post" action="{{ url_for('register') }}" class="form">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="form-group">
            <label for="username">用户名</label>
            <input
                type="text"
                id="username"
                name="username"
                maxlength="50"
                autocomplete="username"
                placeholder="请输入用户名"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input
                type="password"
                id="password"
                name="password"
                maxlength="128"
                autocomplete="new-password"
                placeholder="请输入密码"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">邮箱</label>
            <input
                type="email"
                id="email"
                name="email"
                maxlength="100"
                placeholder="请输入邮箱"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">手机号</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                maxlength="20"
                placeholder="请输入手机号"
                required
            >
        </div>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <button type="submit" class="btn btn-primary">注册</button>
    </form>
</div>
{% endblock %}
