<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>用户管理系统</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="brand">用户管理系统</span>
        </div>

        <div class="nav-right">
            {% if session.get("username") %}
                <span class="nav-welcome">
                    欢迎，{{ session["username"] }}
                </span>

                <a
                    href="{{ url_for('upload') }}"
                    class="nav-link"
                >
                    上传头像
                </a>

                <a
                    href="{{ url_for('profile') }}?user_id=1"
                    class="nav-link"
                >
                    个人中心
                </a>

                <a
                    href="{{ url_for('shop') }}"
                    class="nav-link"
                >
                    商城
                </a>

                <a
                    href="{{ url_for('admin_panel') }}"
                    class="nav-link"
                >
                    管理
                </a>

                <form
                    method="post"
                    action="{{ url_for('logout') }}"
                    class="inline-form"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >
                    <button
                        type="submit"
                        class="nav-link nav-button"
                    >
                        退出
                    </button>
                </form>
            {% else %}
                <a
                    href="{{ url_for('register') }}"
                    class="nav-link"
                >
                    注册
                </a>
                <a
                    href="{{ url_for('login') }}"
                    class="nav-link"
                >
                    登录
                </a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
